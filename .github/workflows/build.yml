name: Build YouTube SEO AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Generate Android wrapper
        run: flutter create --platforms=android --org com.shahriar.youtubeseo --project-name youtube_seo_ai app_build

      - name: Copy application source
        run: |
          cp pubspec.yaml app_build/pubspec.yaml
          cp -R lib/. app_build/lib/
          cp -R test/. app_build/test/
          cp android/app/src/main/AndroidManifest.xml app_build/android/app/src/main/AndroidManifest.xml

      - name: Resolve packages
        working-directory: app_build
        run: flutter pub get

      - name: Analyze source
        working-directory: app_build
        run: flutter analyze --no-pub

      - name: Run tests
        working-directory: app_build
        run: flutter test --no-pub

      - name: Build release APK
        working-directory: app_build
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-seo-ai-release
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
