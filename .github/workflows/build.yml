name: Build YouTube SEO AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Extract ZIP & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP File
        run: |
          if [ -f "youtube_seo_ai_source.zip" ]; then
            echo "Extracting youtube_seo_ai_source.zip..."
            unzip -o youtube_seo_ai_source.zip -d extracted_source
          else
            ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting $ZIP_FILE..."
              unzip -o "$ZIP_FILE" -d extracted_source
            else
              echo "Error: No ZIP file found in repository root!"
              exit 1
            fi
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Initialize Android Project & Merge Source Files
        run: |
          flutter create --org com.shahriar.youtubeseo --project-name youtube_seo_ai app_build
          cp -r extracted_source/lib/* app_build/lib/
          cp extracted_source/pubspec.yaml app_build/pubspec.yaml
          cp extracted_source/android/app/src/main/AndroidManifest.xml app_build/android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        working-directory: app_build
        run: flutter pub get

      - name: Build Release APK
        working-directory: app_build
        run: flutter build apk --release

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-seo-ai-release-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
