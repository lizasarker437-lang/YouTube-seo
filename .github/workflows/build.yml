name: Build YouTube SEO Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Extract ZIP, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Extract Source ZIP File
        run: |
          if [ -f "YouTubeSEOPro_Android_Source.zip" ]; then
            echo "Extracting YouTubeSEOPro_Android_Source.zip..."
            unzip -o YouTubeSEOPro_Android_Source.zip -d android_project
          else
            ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting $ZIP_FILE..."
              unzip -o "$ZIP_FILE" -d android_project
            else
              echo "ERROR: No Source ZIP file found in repository root!"
              exit 1
            fi
          fi

      - name: 3. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Verify Pre-installed Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Setup Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 6. Run Unit Tests
        working-directory: android_project
        run: gradle testDebugUnitTest --stacktrace

      - name: 7. Build Debug & Release APKs
        working-directory: android_project
        run: |
          gradle assembleDebug --stacktrace
          gradle assembleRelease --stacktrace

      - name: 8. Verify Generated APK
        working-directory: android_project
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: 9. Upload Debug APK (Ready to Install)
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeSEOPro-v2.0.0-debug-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 10. Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeSEOPro-v2.0.0-release-unsigned-apk
          path: android_project/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: 11. Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-logs
          path: android_project/app/build/reports/
          retention-days: 7
