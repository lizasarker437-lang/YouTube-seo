name: Build YouTube SEO Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Extract Latest ZIP, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Auto-Detect & Extract Latest Project ZIP File
        run: |
          rm -rf android_project
          mkdir -p android_project
          LATEST_YT_ZIP=$(ls -1v YouTubeSEOPro*.zip 2>/dev/null | tail -n 1 || true)
          if [ -n "$LATEST_YT_ZIP" ]; then
            echo "Found latest YouTubeSEOPro archive: $LATEST_YT_ZIP"
            unzip -o "$LATEST_YT_ZIP" -d android_project
          else
            ANY_ZIP=$(ls -1v *.zip 2>/dev/null | tail -n 1 || true)
            if [ -n "$ANY_ZIP" ]; then
              echo "Found ZIP archive: $ANY_ZIP"
              unzip -o "$ANY_ZIP" -d android_project
            else
              echo "ERROR: No .zip file found in repository root!"
              exit 1
            fi
          fi
          ls -la android_project

      - name: 3. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Verify Pre-installed Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 6. Run Unit Tests
        working-directory: android_project
        run: gradle testDebugUnitTest --stacktrace

      - name: 7. Build Debug & Release APKs
        working-directory: android_project
        run: |
          gradle assembleDebug --stacktrace
          gradle assembleRelease --stacktrace

      - name: 8. Verify Generated APK
        working-directory: android_project
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: 9. Upload Debug APK (Ready to Install on Phone)
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeSEOPro-v2.6.0-debug-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 10. Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeSEOPro-v2.6.0-release-unsigned-apk
          path: android_project/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
